<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Liste des vols</title>
    <link th:href="@{/assets/vendor/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/assets/css/style.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<!-- Contenu principal -->
<div class="content container mt-4">
    <h2 class="mb-4 text-center">Liste des vols</h2>

    <div class="mb-3 text-end">
        <a th:href="@{/vol/save-page}" class="btn btn-success">
            + Ajouter un nouveau vol
        </a>
    </div>

    <!-- Formulaire de recherche -->
    <form th:action="@{/vol/filter}" method="get" class="mb-4">
        <div class="row g-3">
            <div class="col-md-2">
                <select name="avion" class="form-select">
                    <option value="">-- Avion --</option>
                    <option th:each="a : ${avions}" th:value="${a.id}" th:text="${a.libelle}"
                            th:selected="${a.id == selectedAvion}"></option>
                </select>
            </div>
            <div class="col-md-2">
                <select name="villeDepart" class="form-select">
                    <option value="">-- Ville de départ --</option>
                    <option th:each="v : ${villes}" th:value="${v.id}" th:text="${v.nom}"
                            th:selected="${v.id == selectedVilleDepart}"></option>
                </select>
            </div>
            <div class="col-md-2">
                <input type="text" name="villeArrivee" class="form-control" placeholder="ID Ville arrivée">
            </div>
            <div class="col-md-2">
                <input type="datetime-local" name="dateDepart" class="form-control" placeholder="Date départ">
            </div>
            <div class="col-md-2">
                <input type="datetime-local" name="dateArrivee" class="form-control" placeholder="Date arrivée">
            </div>
            <div class="col-md-2">
                <input type="text" name="prixBase" class="form-control" placeholder="Prix de base">
            </div>
        </div>
        <div class="text-center mt-3">
            <button type="submit" class="btn btn-primary">Rechercher</button>
        </div>
    </form>

    <!-- Résultat -->
    <div th:if="${vols != null and !vols.isEmpty()}">
        <div class="table-responsive">
            <table class="table table-bordered table-hover table-striped">
                <thead class="table-dark">
                <tr>
                    <th>Numéro de vol</th>
                    <th>Avion</th>
                    <th>Départ</th>
                    <th>Arrivée</th>
                    <th>Date départ</th>
                    <th>Date arrivée</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="vol : ${vols}">
                    <td th:text="${vol.id}"></td>
                    <td th:text="${vol.avion.libelle}"></td>
                    <td th:text="${vol.villeDepart.nom}"></td>
                    <td th:text="${vol.villeArrivee.nom}"></td>
                    <td th:text="${vol.dateDepart}"></td>
                    <td th:text="${vol.dateArrivee}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:if="${vols == null or vols.isEmpty()}">
        <div class="alert alert-warning text-center" role="alert">
            Aucun vol disponible pour le moment.
        </div>
    </div>
</div>

<script th:src="@{/assets/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
